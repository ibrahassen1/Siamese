services:
  postgres:
    image: postgres:16
    container_name: siamese-postgres

    environment:
      POSTGRES_DB: siamese
      POSTGRES_USER: siamese
      POSTGRES_PASSWORD: siamese_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siamese -d siamese"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: